<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self' https://*.trycloudflare.com; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#f7f5ee">
  <title>Aside · Character roleplay</title>
  <style>
    :root{color-scheme:light;background:#f7f5ee;color:#272a22;font:17px/1.6 system-ui,sans-serif}
    body{margin:0;min-height:100svh;display:grid;place-items:center}
    main{margin:2rem;max-width:26rem}
    h1{font:normal clamp(2.4rem,10vw,4rem)/1.12 Georgia,serif;margin:0}
    p{color:#53574b}
    button{font:inherit;background:#303b2f;color:#fff;border:0;border-radius:.4rem;padding:.55rem 1.2rem}
    button:focus-visible{outline:3px solid #4a624b;outline-offset:3px}
  </style>
</head>
<body>
<main><h1>Aside</h1><p id="status" role="status">Connecting to your Mac…</p><button id="retry" type="button" hidden>Try again</button></main>
<script>
  const retry = document.getElementById("retry");
  const statusLine = document.getElementById("status");
  let busy = false;
  let timer;
  async function openApp() {
    if (busy || document.hidden) return;
    busy = true;
    clearTimeout(timer);
    retry.hidden = true;
    statusLine.textContent = "Connecting to your Mac…";
    const controller = new AbortController();
    const deadline = setTimeout(() => controller.abort(), 12000);
    const options = {credentials: "omit", cache: "no-store", redirect: "error", signal: controller.signal};
    try {
      const record = await fetch("connection.json?t=" + Date.now(), options);
      if (!record.ok) throw new Error();
      const {origin} = await record.json();
      if (typeof origin !== "string" || !/^https:\/\/[a-z0-9]+(?:-[a-z0-9]+)*\.trycloudflare\.com$/.test(origin)) throw new Error();
      const response = await fetch(origin + "/api/health", options);
      if (!response.ok) throw new Error();
      const health = await response.json();
      if (health.app !== "roleplay" || health.status !== "ok") throw new Error();
      location.replace(origin);
    } catch {
      statusLine.textContent = "Your Mac is unreachable. It needs to be awake and online.";
      retry.hidden = false;
      timer = setTimeout(openApp, 15000);
    } finally {
      clearTimeout(deadline);
      busy = false;
    }
  }
  retry.addEventListener("click", openApp);
  window.addEventListener("online", openApp);
  document.addEventListener("visibilitychange", openApp);
  openApp();
</script>
</body>
</html>
