<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title></title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #222; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; }
    main { max-width: 440px; margin: 0 auto; padding: max(48px, env(safe-area-inset-top)) 24px 24px; }
    input { display: block; width: 100%; min-height: 52px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    p { font-size: 14px; line-height: 1.5; margin: 12px 0 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <label for="file" class="sr-only">Choose access key file</label>
    <input id="file" type="file" accept=".txt,.key,text/plain" disabled>
    <p id="error" role="alert" hidden></p>
    <noscript><p>JavaScript is required.</p></noscript>
  </main>
  <script type="module">
    const error = document.getElementById('error');
    const allowedOrigin = /^https:\/\/[a-z0-9]+(?:-[a-z0-9]+)*\.trycloudflare\.com$/;
    const delivery = /^#receive=([A-Za-z0-9_-]{43})$/.exec(location.hash);
    let checking = null;
    let leaving = false;
    async function verifyAndOpen() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      try {
        const response = await fetch(`./connection.json?t=${Date.now()}`, {
          cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer',
          redirect: 'error', signal: controller.signal,
        });
        if (!response.ok) throw new Error();
        const data = await response.json();
        if (!data || typeof data.origin !== 'string' || !allowedOrigin.test(data.origin)) throw new Error();
        const probe = await fetch(data.origin + '/api/health', {
          mode: 'cors', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer',
          redirect: 'error', signal: controller.signal,
        });
        if (!probe.ok || !probe.headers.get('content-type')?.includes('application/json')) throw new Error();
        const health = await probe.json();
        if (!health || health.status !== 'ok' || health.version !== '0.2.0' || Object.keys(health).length !== 2) throw new Error();
        error.hidden = true;
        leaving = true;
        location.replace(data.origin + (delivery ? '/receive/' + delivery[1] : '/'));
      } catch {
        error.textContent = 'Offline. Reconnecting…';
        error.hidden = false;
      } finally { clearTimeout(timeout); }
    }
    function check() {
      if (!leaving && !checking) checking = verifyAndOpen().finally(() => {checking = null;});
    }
    window.addEventListener('online', check);
    window.addEventListener('pageshow', event => {if (event.persisted) {leaving = false;check();}});
    document.addEventListener('visibilitychange', () => {if (!document.hidden) check();});
    setInterval(() => {if (!document.hidden) check();}, 15000);
    check();
  </script>
</body>
</html>
